name: CI - Build validacion

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Build CDL
        run: npm run build -- --mode cdl.dev

      - name: Build ENRO
        run: npm run build -- --mode enro.dev
